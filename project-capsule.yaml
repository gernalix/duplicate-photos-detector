schema_version: c2.project-capsule.v1
identity:
  project_id: 102
  slug: duplicate-photos-detector
  repository_id: R0103
scope:
  purpose: Find exact or transformed copies of the same underlying image in an owner-selected
    local photo archive.
  boundaries:
  - Does not perform face recognition or infer whether different photos depict the
    same person.
  - Does not own, export, upload, or commit original photos, private indexes, embeddings,
    diagnostics, or cached model weights.
  - User-specific archive paths and service activation stay in local configuration.
repository:
  canonical_workdir: /home/daniele/projects/duplicate-photos-detector
  branch_policy: Use an isolated task worktree and the existing per-repository single
    writer and PR queue.
architecture:
  summary: A Typer CLI runs incremental indexing and image search through a SQLite
    PhotoIndex, staged hash and geometric matching, and optional local embeddings.
  entrypoints:
  - src/duplicate_photos_detector/cli.py
  - src/duplicate_photos_detector/engine.py
  important_paths:
  - src
  - tests
  - pyproject.toml
  - README.md
  - AGENTS.md
  - systemd
  - .github
dependencies:
- name: Pillow
  purpose: Decode and transform images.
- name: ImageHash
  purpose: Perceptual and crop-resistant hashes.
- name: numpy
  purpose: Image and geometry arrays.
- name: opencv-python-headless
  purpose: SIFT features, geometric verification, and image warping.
- name: typer
  purpose: Command-line interface.
- name: rich
  purpose: Terminal result formatting.
- name: open_clip_torch and torch (optional embed extra)
  purpose: Optional local visual-similarity fallback; not proof of image identity.
- name: faiss-cpu (optional faiss extra)
  purpose: Optional nearest-neighbor acceleration for embeddings.
data:
  schema: The local SQLite images table stores file paths, archive root, hashes, dimensions,
    size and timestamps, with optional embedding data; original image files remain
    in the owner-selected archive.
  migrations: PhotoIndex creates its table and indexes idempotently at startup; there
    is no separate migration framework.
runtime:
  services:
  - systemd/duplicate-photos-detector-index.service.template
  - systemd/duplicate-photos-detector-watch.service.template
  timers:
  - systemd/duplicate-photos-detector-index.timer.template
  containers: []
devices: []
commands:
  setup:
    argv:
    - python3
    - -m
    - pip
    - install
    - -e
    - .[dev]
    cwd: .
  build:
    argv:
    - python3
    - -m
    - pip
    - wheel
    - --no-deps
    - --no-build-isolation
    - --wheel-dir
    - /tmp/duplicate-photos-detector-wheel
    - .
    cwd: .
  test_targeted:
    argv:
    - python3
    - -m
    - pytest
    - -q
    - tests/test_engine.py
    cwd: .
  test_full:
    argv: &id001
    - bwrap
    - --die-with-parent
    - --unshare-net
    - --unshare-pid
    - --ro-bind
    - /
    - /
    - --tmpfs
    - /home
    - --tmpfs
    - /run
    - --tmpfs
    - /tmp
    - --tmpfs
    - /mnt
    - --tmpfs
    - /media
    - --tmpfs
    - /var/lib
    - --proc
    - /proc
    - --dev
    - /dev
    - --ro-bind
    - .
    - /tmp/work
    - --ro-bind
    - /home/daniele/.local/lib/python3.14/site-packages
    - /home/daniele/.local/lib/python3.14/site-packages
    - --chdir
    - /tmp/work
    - --clearenv
    - --setenv
    - PATH
    - /usr/bin:/bin
    - --setenv
    - HOME
    - /tmp
    - --setenv
    - PYTHONPATH
    - /tmp/work/src:/usr/lib64/python3.15/site-packages:/usr/lib/python3.15/site-packages:/home/daniele/.local/lib/python3.14/site-packages
    - --setenv
    - PYTHONDONTWRITEBYTECODE
    - '1'
    - --setenv
    - PYTEST_DISABLE_PLUGIN_AUTOLOAD
    - '1'
    - /usr/bin/python3
    - -B
    - -m
    - pytest
    - -q
    - -p
    - no:cacheprovider
    - tests
    cwd: .
  lint:
    not_applicable: No linter or lint configuration is defined in pyproject.toml.
  deploy_install:
    not_applicable: Unit templates require owner-specific archive/database paths and
      manual local systemd activation.
  smoke:
    not_applicable: A live smoke test would access or mutate the owner's private archive;
      synthetic tests are the safe smoke check.
  verify:
    fast:
      argv:
      - python3
      - /home/daniele/projects/codex-roadmap/tools/project_capsule.py
      - --repo
      - .
      - --mode
      - FAST
      cwd: .
    full:
      argv:
      - python3
      - /home/daniele/projects/codex-roadmap/tools/project_capsule.py
      - --repo
      - .
      - --mode
      - FULL
      cwd: .
safety:
  invariants:
  - Match classification concerns the same underlying image, never identity of people.
  - Original photos and local index data stay local and out of Git.
  - Semantic embeddings are fallback similarity evidence and never proof of same-image
    identity.
  - Generated bytecode/build outputs stay ignored; source cleanup preserves original
    working files and their history instead of treating them as separate implementation
    capsules.
  risky_operations:
  - Indexing writes the local SQLite index; run it only against an explicitly selected
    archive and database.
  - The --prune option removes index rows for files absent from the selected archive;
    review the archive and database paths first.
  - The watch service continuously scans and writes the index; use the one-shot timer
    template for normal periodic refresh and do not activate a live service during
    source validation.
  - Optional OpenCLIP setup may download model weights; keep cached weights local
    and do not commit them.
  recovery:
  - Original photos remain the source of truth; the index can be rebuilt, but any
    local index backup/rebuild decision is owner-managed and absent from repository
    deployment commands.
acceptance:
- FAST validates capsule schema, MegaVault identity, paths, commands, freshness, and
  changed-file mapping.
- FULL passes FAST and runs the safe synthetic pytest suite without reading or changing
  a private photo archive.
- The capsule describes only the canonical source repository and leaves runtime paths
  and private data local.
references:
  megavault: /home/daniele/MegaVault/megavault.sqlite
  c2: Historical-only reference; no dispatcher or lifecycle writes.
freshness:
  reviewed_commit: 1ad3d492b837594b10b7391e0678e6dbdc18a30c
  watch_paths:
  - src
  - tests
  - pyproject.toml
  - systemd
  - .github
artifacts:
  agents: AGENTS.md
  architecture: README.md
  operations: README.md
  data_model: src/duplicate_photos_detector/engine.py
validation_hooks:
- id: isolated-synthetic-pytest
  argv: *id001
  cwd: .
  safe: true
change_verification:
- paths:
  - src/*
  - tests/*
  - pyproject.toml
  - systemd/*
  - .github/*
  - project-capsule.yaml
  commands:
  - test_full
